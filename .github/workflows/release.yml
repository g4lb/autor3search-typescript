# Publishes to npm with trusted publishing (OIDC) — no token, anywhere.
#
# npm mints a short-lived credential from GitHub's OIDC identity, so there is
# nothing to store, rotate or leak, and it attaches a provenance attestation
# linking the published tarball to this workflow run and commit.
#
# The npmjs.com side must name THIS FILE ("release.yml") as the trusted
# publisher for @autor3search/typescript. Renaming this file breaks publishing
# until the trusted publisher is updated to match.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  # Without id-token: write there is no OIDC token to exchange, and npm falls
  # back to asking for a credential that does not exist here.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # registry-url is deliberately NOT set: npm publishes to
      # registry.npmjs.org by default, and setting it writes an .npmrc with a
      # placeholder auth token that suppresses the OIDC exchange entirely.
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs Node >= 22.14.0.
          node-version: '22'
          cache: npm

      # setup-node ships the npm bundled with Node 22, which is 10.x — too old
      # for OIDC. Trusted publishing needs npm >= 11.5.1, so install it.
      - name: Install an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci

      # The same gates ci.yml runs. A release is not the place to find out that
      # the tagged commit does not pass them.
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

      # A tag that disagrees with package.json publishes a version nobody asked
      # for, under a name that says otherwise. Fail before the registry sees it.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "tag and package.json agree on $pkg"

      # No NODE_AUTH_TOKEN and no .npmrc: npm must find no credential in order
      # to reach for the OIDC one. --access public because a scoped package is
      # private by default (package.json also sets publishConfig.access).
      - run: npm publish --access public
