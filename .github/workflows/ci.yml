name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # The tool has 12 platform-specific branches -- the state home
    # (~/Library/Caches, %LOCALAPPDATA%, $XDG_CACHE_HOME), five doctor
    # probes, and `detached: process.platform !== 'win32'` in exec.ts, which
    # is the process-group kill behind every timeout and `stop -force`.
    # Until this matrix existed, all of it was tested on ubuntu only, while
    # the README documented Windows and macOS support.
    #
    # Node 22 is the floor `engines` declares; 24 is current. A release that
    # only ever ran on the floor is a release whose users are the test.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # A second run, on one configuration only. The rare failure this was
      # originally added to hunt (deferred-minors item 15) has since been
      # identified and fixed -- two load-sensitive assertions -- so this is
      # no longer a hunt but cheap insurance: this suite necessarily
      # contains timing-sensitive tests, and a single green run is weaker
      # evidence than two. Running it on every matrix leg would double the
      # whole matrix's cost for very little added signal.
      - if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npm test

  audit:
    # The dependency audit was run by hand once, during a security pass.
    # Once is not a control; a new advisory against a transitive dependency
    # should reach us on the next push, not the next time somebody thinks to
    # look. --audit-level=high so a low-severity advisory does not block
    # unrelated work.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
